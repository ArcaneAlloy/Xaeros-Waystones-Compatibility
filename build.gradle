plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '2.1.0'
group = 'fr.shoqapik.w2w2'

base {
    archivesName = 'xaeros_waystones_compatibility-NeoForge-26.1.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = '26.1.2.22-beta'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        w2w2 {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    compileOnly "curse.maven:waystones-245755:7939341"
    compileOnly "curse.maven:balm-531761:7959844"
    compileOnly "curse.maven:shogi-1475746:7939269"
    // Xaero's Minimap — solo necesario para compilar, World Map no se usa en el código
    compileOnly "curse.maven:xaeros-minimap-263420:7971263"
    // shogi-api embebido en shogi
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
